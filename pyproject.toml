[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muedit"
version = "2.1.0"
description = "FastICA-based Motor Unit decomposition of High-Density EMG signals"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11.4"  # tarfile extraction filters
authors = [
  { name = "Simon Avrillon" },
]
keywords = ["EMG", "motor unit", "decomposition", "ICA", "electromyography", "neuroscience"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.4",
  "scipy>=1.17",
  "matplotlib>=3.9",
  "xmltodict>=0.14",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "h5py>=3.12",
  "fastapi>=0.141",
  "starlette>=1.3.1",  # imported directly; floor clears known advisories
  "uvicorn>=0.32",
  "python-multipart>=0.0.31",  # floor clears known advisories
  "pyedflib>=0.1.36",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",  # FastAPI TestClient backend (tests/test_api_http.py)
  "ruff==0.15.16",  # keep in sync with the rev in .pre-commit-config.yaml
  "mypy==2.3.1",
  "pre-commit>=4.0",
  "types-PyYAML",
]
notebook = [
  "jupyterlab>=4.6.2",  # floor clears known advisories
  "ipykernel>=6.29",
]
research = [
  "optuna>=4.3",
]

[project.scripts]
muedit-api = "muedit.cli:serve_api"
muedit-decompose = "muedit.cli:run_decomposition_cli"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["muedit*"]

[project.urls]
Repository = "https://github.com/simonavrillon/MUedit2"
"Bug Tracker" = "https://github.com/simonavrillon/MUedit2/issues"

[tool.pytest.ini_options]
# The ``muedit`` package lives under ``python/src`` (see [tool.setuptools]
# above).  Adding it to ``pythonpath`` lets the suite run from a fresh
# checkout without an editable install (``pip install -e .``), which is
# convenient for CI and local one-shot runs.  The repo root is added so the
# ``from tests._helpers import ...`` imports resolve under a bare ``pytest``.
pythonpath = ["python/src", "."]
testpaths = ["tests"]
# Report a one-line summary for every non-passed outcome (skips, xfails,
# failures).  Useful here because conftest.py skips data-dependent tests
# when the git-ignored sample files are absent, so a clean run still emits
# skips worth seeing at a glance.
addopts = ["-ra", "--strict-markers"]
# CI runs ``-m "not data"``: runners have no recordings under data/.  That
# tier is also the fast one (~1.5 min), since the decomposition benchmark and
# simulation tests all need recordings.  Run everything locally with a plain
# ``pytest``.  conftest.py applies ``data`` to any test that depends on a
# sample-file fixture, so it never needs hand-marking.
markers = [
  "data: needs git-ignored sample recordings under data/ (auto-applied)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Notebooks are ad-hoc utilities, not package code.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  # Style and modernisation
  "I", "UP", "FA", "ANN", "C4", "SIM", "RET", "PERF", "RUF",
  # Bug finders
  "F", "B", "PLE", "PLW", "BLE", "S",
]
# ANN401: Any is deliberate at the JSON/array boundaries.
# C408: dict(key=value) calls read fine and are common in parameter overrides.
# RUF001-003: Greek letters and other non-ASCII symbols are intentional in
#   comments and docstrings.
# RUF046: int(round(x)) is kept as an explicit, numpy-safe idiom.
# S101: assert is used for internal invariants and throughout the tests.
# S603/S607: subprocess calls use fixed argument lists (file dialog helpers).
ignore = ["ANN401", "C408", "RUF001", "RUF002", "RUF003", "RUF046", "S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["muedit", "tests"]

[tool.mypy]
python_version = "3.12"  # numpy >=2.5 stubs use 3.12 syntax; ruff still targets py311
files = ["python/src/muedit", "tests"]
mypy_path = "python/src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["scipy.*", "h5py.*", "pyedflib.*", "xmltodict.*", "matplotlib.*"]
ignore_missing_imports = true
