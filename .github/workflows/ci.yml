name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # ruff is pinned in pyproject.toml's dev extra and resolved through
      # uv.lock, so a new ruff release cannot reformat the tree underneath us.
      - run: uv run --locked --extra dev ruff check --output-format=github .
      - run: uv run --locked --extra dev ruff format --check .

  python:
    name: Python · mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # dependency edit that skipped `uv lock` cannot reach main.  The lock
      # pins the full transitive graph, so CI runs the exact versions a
      # developer gets from `uv sync`.
      - run: uv sync --locked --extra dev
      - run: uv run mypy
      # Runners have no recordings under data/, so the data tier is deselected.
      # MUEDIT_REQUIRE_DATA turns any remaining missing-file skip into a
      # failure, which catches a data-dependent test the marker missed.
      - name: pytest (not data)
        env:
          MUEDIT_REQUIRE_DATA: "1"
          # Safety net: should a benchmark test escape the marker, it writes
          # here instead of the committed leaderboard.
          MUEDIT_BENCHMARK_LEADERBOARD: ${{ runner.temp }}/leaderboard.json
        run: uv run pytest -m "not data" --cov=muedit --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend · eslint + prettier + tsc + node --test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines.node floor in package.json; 22 is current LTS.
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
