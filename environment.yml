# DEPRECATED — MUedit now uses uv (see README "Quick Start"): `uv sync`.
#
# This file is kept for one release so in-flight work is not disrupted.  It is
# no longer tested in CI and its pins are no longer the source of truth --
# pyproject.toml declares the dependencies and uv.lock pins them.  The two were
# identical at the time of the switch; they will drift as uv.lock is updated.
#
name: MUedit
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pip
  # Numerical / scientific core
  - numpy=1.26.4
  - scipy=1.13.1
  - matplotlib=3.9.2
  - xmltodict=0.14.2
  - pydantic=2.10.2
  - pyyaml=6.0.2
  - h5py=3.12.1
  # File dialog (tkinter backend for Linux/Windows)
  - tk
  # Web server
  - fastapi=0.115.5
  - uvicorn=0.32.0
  - python-multipart=0.0.12
  # Notebooks (utilities under notebooks/)
  - jupyterlab=4.2.5
  - ipykernel=6.29.5
  # Schema-based BIDS validator used by the metadata notebook (run via `deno run`)
  - deno=2.8.0
  - pip:
    # EMG / EEG file I/O
    - pyedflib==0.1.42
    # Hyperparameter optimisation
    - optuna==4.3.0
